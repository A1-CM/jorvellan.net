name: Roll back Jorvellan on cPanel

on:
  workflow_dispatch:
    inputs:
      steps_back:
        description: Previous activated release to restore (1–7)
        required: true
        default: 1
        type: number
      public_dir:
        description: auto, public_html, or a directory relative to cPanel home
        default: auto
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: cpanel-jorvellan-https://jorvellan.net
      cancel-in-progress: false
    steps:
      - name: Check out deployment toolkit
        uses: actions/checkout@v4
        with:
          repository: A1-CM/.github
          ref: v1.0.9
          path: toolkit
      - name: Install rollback client
        run: python3 -m pip install requests
      - name: Restore retained release
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ vars.CPANEL_USERNAME }}
          CPANEL_HOME: ${{ vars.CPANEL_HOME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          PROJECT_SLUG: jorvellan
          APP_URL: https://jorvellan.net
          CPANEL_DOMAIN: ${{ vars.CPANEL_DOMAIN }}
          CPANEL_PUBLIC_DIR: ${{ inputs.public_dir || vars.CPANEL_PUBLIC_DIR || 'auto' }}
          CPANEL_HEALTH_PATH: ${{ vars.CPANEL_HEALTH_PATH || '/up' }}
        run: python3 toolkit/scripts/deploy_cpanel.py --rollback ${{ inputs.steps_back }}
